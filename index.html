<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TDK CLI</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0b0d10;
        color: #f4f1e8;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      main {
        width: min(720px, calc(100vw - 40px));
      }
      h1 {
        margin: 0 0 16px;
        font-size: clamp(44px, 9vw, 88px);
        line-height: .9;
        letter-spacing: 0;
      }
      p {
        color: #b8b4aa;
        font-size: 18px;
        line-height: 1.55;
      }
      pre {
        overflow-x: auto;
        padding: 18px 20px;
        border: 1px solid #2b3038;
        background: #11151b;
        border-radius: 8px;
      }
      code {
        font: 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: #e6f18f;
      }
      a {
        color: #8ec5ff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>TDK CLI</h1>
      <p>Install the latest TDK CLI binary for Linux, macOS, Arch, and Omarchy.</p>
      <pre><code>curl -fsSL https://tdk-landscape.github.io/install.sh | sh</code></pre>
      <p>
        Binaries are published at
        <a href="https://github.com/tdk-landscape/tdk-cli-releases/releases/latest">tdk-cli-releases-public</a>.
      </p>
    </main>
  </body>
</html>
